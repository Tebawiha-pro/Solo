workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create Android and Fix compileSdk
        script: |
          flutter create . --platforms=android --org com.tebawiha.solo
          echo "Checking files..."
          ls -la
          ls -la android/app/ || echo "android/app not found"
          FILE="android/app/build.gradle"
          echo "Fixing $FILE"
          sed -i '' 's/compileSdkVersion 33/compileSdkVersion 36/g' $FILE
          sed -i '' 's/compileSdk 33/compileSdk 36/g' $FILE
          sed -i '' 's/targetSdkVersion 33/targetSdkVersion 36/g' $FILE
          sed -i '' 's/targetSdk 33/targetSdk 36/g' $FILE
          sed -i '' 's/flutter.compileSdkVersion/36/g' $FILE
          sed -i '' 's/flutter.targetSdkVersion/36/g' $FILE
          echo "--- File after fix ---"
          cat $FILE
      - name: Get Flutter packages
        script: |
          flutter pub upgrade
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
