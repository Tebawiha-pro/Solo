workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create Android and Fix compileSdk
        script: |
          flutter create . --platforms=android --org com.tebawiha.solo
          echo "Checking..."
          ls android/app/
          FILE_KTS="android/app/build.gradle.kts"
          FILE_GRADLE="android/app/build.gradle"
          
          if [ -f "$FILE_KTS" ]; then
            echo "Fixing KTS file: $FILE_KTS"
            sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' $FILE_KTS
            sed -i '' 's/compileSdkVersion 33/compileSdkVersion 36/g' $FILE_KTS
            sed -i '' 's/compileSdk = 33/compileSdk = 36/g' $FILE_KTS
            sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' $FILE_KTS
            sed -i '' 's/targetSdkVersion 33/targetSdkVersion 36/g' $FILE_KTS
            sed -i '' 's/targetSdk = 33/targetSdk = 36/g' $FILE_KTS
            cat $FILE_KTS
          fi

          if [ -f "$FILE_GRADLE" ]; then
            echo "Fixing Gradle file: $FILE_GRADLE"
            sed -i '' 's/compileSdkVersion 33/compileSdkVersion 36/g' $FILE_GRADLE
            sed -i '' 's/targetSdkVersion 33/targetSdkVersion 36/g' $FILE_GRADLE
            sed -i '' 's/flutter.compileSdkVersion/36/g' $FILE_GRADLE
            sed -i '' 's/flutter.targetSdkVersion/36/g' $FILE_GRADLE
            cat $FILE_GRADLE
          fi
      - name: Get Flutter packages
        script: |
          flutter pub upgrade
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
